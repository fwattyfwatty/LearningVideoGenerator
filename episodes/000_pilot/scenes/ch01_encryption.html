<style>
  .ch1-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .ch1-title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border-subtle);
  }

  .ch1-heading {
    margin: 0;
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .ch1-sub {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-primary);
    background: #eff6ff;
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid #bfdbfe;
  }

  .ch1-board {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    gap: 18px;
  }

  .lane-box {
    position: relative;
    height: 250px;
    border-radius: 20px;
    background: var(--bg-card);
    border: 2px solid var(--border-subtle);
    padding: 18px 28px;
    display: grid;
    grid-template-columns: 270px 1fr 270px;
    align-items: center;
    gap: 24px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
  }

  .lane-http {
    border-color: #fca5a5;
    background: linear-gradient(90deg, #fff5f5 0%, #ffffff 30%, #ffffff 70%, #fff5f5 100%);
  }

  .lane-https {
    border-color: #86efac;
    background: linear-gradient(90deg, #f0fdf4 0%, #ffffff 30%, #ffffff 70%, #f0fdf4 100%);
  }

  .lane-label {
    position: absolute;
    top: -15px;
    left: 24px;
    padding: 4px 16px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
  }

  .lane-label-http { background: #dc2626; }
  .lane-label-https { background: #16a34a; }

  .node-card {
    height: 156px;
    border-radius: 16px;
    background: var(--bg-card-muted);
    border: 2px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 12px;
  }

  .node-icon {
    font-size: 40px;
    line-height: 1;
  }

  .node-name {
    font-size: 25px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .node-desc {
    font-size: 19px;
    color: var(--text-secondary);
    font-weight: 700;
  }

  .pipe-area {
    position: relative;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pipe-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .packet-pill {
    position: absolute;
    top: 84px;
    left: 36px;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
    white-space: nowrap;
  }

  .packet-plain {
    background: #fef2f2;
    border: 2px solid #ef4444;
    color: #991b1b;
  }

  .packet-cipher {
    background: #ecfdf5;
    border: 2px solid #10b981;
    color: #065f46;
  }

  .center-slot-top {
    position: absolute;
    top: -6px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .center-slot-bottom {
    position: absolute;
    bottom: 6px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .eavesdrop-card {
    padding: 8px 18px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    white-space: nowrap;
  }

  .eavesdrop-danger {
    background: #dc2626;
    color: #ffffff;
  }

  .eavesdrop-blocked {
    background: #334155;
    color: #e2e8f0;
  }

  .lock-shield {
    padding: 6px 18px;
    border-radius: 999px;
    background: #16a34a;
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(22, 163, 74, 0.3);
    white-space: nowrap;
  }
</style>

<div class="ch1-wrap">
  <div class="ch1-title-bar">
    <h1 id="ch1-heading" class="ch1-heading">HTTP と HTTPS の決定的な違い：通信の暗号化</h1>
    <span class="ch1-sub">POINT 1：中身が見られるか？</span>
  </div>

  <div class="ch1-board">
    <!-- Upper Lane: HTTP -->
    <div id="lane-http" class="lane-box lane-http">
      <span class="lane-label lane-label-http">HTTP（暗号化なし）</span>

      <div id="http-browser" class="node-card">
        <div class="node-icon">💻</div>
        <div class="node-name">ブラウザ</div>
        <div class="node-desc">ログイン情報を送信</div>
      </div>

      <div class="pipe-area">
        <svg class="pipe-svg" viewBox="0 0 900 190">
          <line x1="20" y1="108" x2="880" y2="108" stroke="#fecaca" stroke-width="10" stroke-linecap="round" />
          <line id="http-flow-line" x1="20" y1="108" x2="880" y2="108" stroke="#ef4444" stroke-width="10" stroke-linecap="round" stroke-dasharray="860" stroke-dashoffset="860" />
        </svg>

        <div id="http-packet" class="packet-pill packet-plain">
          📩 PW: 123456（丸見え！）
        </div>

        <div class="center-slot-top">
          <div id="http-eavesdrop" class="eavesdrop-card eavesdrop-danger">
            <span>🕵️ 盗聴者：中身がそのまま読める！</span>
          </div>
        </div>
      </div>

      <div id="http-server" class="node-card">
        <div class="node-icon">🖥️</div>
        <div class="node-name">Webサーバー</div>
        <div class="node-desc">そのまま受信</div>
      </div>
    </div>

    <!-- Lower Lane: HTTPS -->
    <div id="lane-https" class="lane-box lane-https">
      <span class="lane-label lane-label-https">HTTPS（TLSで暗号化）</span>

      <div id="https-browser" class="node-card">
        <div class="node-icon">💻</div>
        <div class="node-name">ブラウザ</div>
        <div class="node-desc">鍵をかけて送信</div>
      </div>

      <div class="pipe-area">
        <svg class="pipe-svg" viewBox="0 0 900 190">
          <rect id="https-tunnel" x="15" y="72" width="870" height="72" rx="36" fill="#dcfce7" stroke="#22c55e" stroke-width="3" stroke-dasharray="10 6" />
          <line id="https-flow-line" x1="20" y1="108" x2="880" y2="108" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-dasharray="860" stroke-dashoffset="860" />
        </svg>

        <div id="https-packet" class="packet-pill packet-cipher">
          🔐 9f#k2!xQ8p（暗号文）
        </div>

        <div class="center-slot-bottom">
          <div id="https-lock-badge" class="lock-shield">
            🔒 TLS 暗号化トンネルで保護中
          </div>
        </div>

        <div class="center-slot-top">
          <div id="https-eavesdrop" class="eavesdrop-card eavesdrop-blocked">
            <span>🕵️ 盗聴者：❓ 何が書いてあるか解読不能！</span>
          </div>
        </div>
      </div>

      <div id="https-server" class="node-card">
        <div class="node-icon">🖥️</div>
        <div class="node-name">Webサーバー</div>
        <div class="node-desc">鍵で元に戻して受信</div>
      </div>
    </div>
  </div>
</div>

<script>
window.__diagramBuilders = window.__diagramBuilders || {};
window.__diagramBuilders["ch01_encryption"] = function (tl, cues) {
  gsap.set('#ch1-heading', { opacity: 0, y: -12 });
  gsap.set('#lane-http', { opacity: 0, y: 24 });
  gsap.set('#lane-https', { opacity: 0, y: 24 });
  gsap.set('#http-packet', { opacity: 0, x: 0, scale: 0.9 });
  gsap.set('#http-eavesdrop', { opacity: 0, y: -16, scale: 0.85 });
  gsap.set('#https-tunnel', { opacity: 0, scaleX: 0.2, transformOrigin: 'left center' });
  gsap.set('#https-lock-badge', { opacity: 0, scale: 0.6 });
  gsap.set('#https-packet', { opacity: 0, x: 0, scale: 0.9 });
  gsap.set('#https-eavesdrop', { opacity: 0, y: -16, scale: 0.85 });

  // Cue 1: intro_nodes
  const tIntro = cues.intro_nodes ?? 0.45;
  tl.to('#ch1-heading', { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, tIntro);
  tl.to('#lane-http', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, tIntro + 0.15);

  // Cue 2: show_http_packet
  const tHttp = cues.show_http_packet ?? 5.5;
  tl.to('#http-flow-line', { strokeDashoffset: 0, duration: 0.9, ease: 'power2.inOut' }, tHttp);
  tl.to('#http-packet', { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.4)' }, tHttp + 0.2);
  tl.to('#http-packet', { x: 260, duration: 1.6, ease: 'power1.inOut' }, tHttp + 0.5);

  // Cue 3: show_eavesdrop
  const tEave = cues.show_eavesdrop ?? 9.5;
  tl.to('#http-eavesdrop', { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, tEave);
  tl.to('#http-packet', { scale: 1.08, duration: 0.25, ease: 'power2.out' }, tEave + 0.35);

  // Cue 4: show_https_lock
  const tLock = cues.show_https_lock ?? 16.5;
  tl.to('#lane-https', { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, tLock);
  tl.to('#https-tunnel', { opacity: 1, scaleX: 1, duration: 0.6, ease: 'power2.out' }, tLock + 0.25);
  tl.to('#https-lock-badge', { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.7)' }, tLock + 0.45);

  // Cue 5: show_encrypted_flow
  const tEnc = cues.show_encrypted_flow ?? 20.5;
  tl.to('#https-flow-line', { strokeDashoffset: 0, duration: 0.9, ease: 'power2.inOut' }, tEnc);
  tl.to('#https-packet', { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.4)' }, tEnc + 0.2);
  tl.to('#https-packet', { x: 520, duration: 2.0, ease: 'power1.inOut' }, tEnc + 0.5);
  tl.to('#https-eavesdrop', { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(1.5)' }, tEnc + 1.0);
};
</script>
