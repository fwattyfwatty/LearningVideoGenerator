<style>

  .c6-card-num {
    display: inline-block;

    font-weight: 700;
  }

  .c6-card-title {
    font-size: 25px;
    font-weight: 700;

  }

  .c6-card-desc {
    font-size: 20px;
    font-weight: 700;

    display: flex;

    padding: 8px 18px;
    border-radius: 12px;

<div class="c6-wrap">

    <div id="c6-card-1" class="c6-card">

      <span class="c6-card-num" style="background: #b45309;">POINT 2</span>

<script>
window.__diagramBuilders = window.__diagramBuilders || {};
window.__diagramBuilders["ch06_summary"] = function (tl, cues) {
  gsap.set(['#c6-card-1', '#c6-card-2', '#c6-card-3', '#c6-next-bar'], { opacity: 0, y: 20 });

  const t1 = cues.c6_map_1 ?? 0.45;
  tl.to('#c6-card-1', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, t1);

  const t2 = cues.c6_map_2 ?? 8.5;
  tl.to('#c6-card-2', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, t2);

  const t3 = cues.c6_map_3 ?? 16.5;
  tl.to('#c6-card-3', { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, t3);

  const tNext = cues.c6_tsumugi_next ?? 30.0;
  tl.to('#c6-next-bar', { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.4)' }, tNext);
};
</script>
